<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cangaço</title>
    <!-- A grade (canvas na celula dele, HUD em cima, menu a direita) e a pele
         de xilogravura moram em src/ui/estilo.css: a interface e de ui/, e o
         index.html so pendura os nos que os modulos de ui/ preenchem. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/ui/estilo.css" />
  </head>
  <body>
    <!-- Layout 2, fatia 4: os avisos (F22) sao carimbos DENTRO do HUD, nao
         caixa sobre o mapa. ui/alertas.ts so procura #alertas; e o CSS quem
         os poe a direita dos recursos. -->
    <div id="hud"><aside id="alertas" hidden></aside></div>
    <div id="jogo"></div>
    <aside id="ajuda" hidden></aside>
    <!-- Layout 2: o balcao e a faixa de contexto no rodape (linha 3 da grade),
         e o painel de predio mora DENTRO dele. A prancha e a coluna da direita.
         Os dois retraem por `data-prancha` / `data-balcao` no <body>. -->
    <footer id="balcao"><section id="painel-predio" hidden></section></footer>
    <aside id="menu-build"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
