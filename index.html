<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cangaço</title>
    <style>
      /* Grade, nao sobreposicao: o canvas ocupa SO a celula dele. O ponteiro
         sobre o HUD ou o painel nunca chega ao Phaser — em vez de a cena
         ignorar cliques em faixas de pixel. As dimensoes sao fixas de
         proposito: o Phaser mede o pai no boot, e o tamanho nao pode depender
         de o HUD ja ter texto nessa hora. */
      :root { --altura-hud: 38px; --largura-painel: 260px; }
      html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; }
      body {
        display: grid; height: 100vh;
        grid-template-columns: 1fr var(--largura-painel);
        grid-template-rows: var(--altura-hud) 1fr;
      }
      #hud {
        grid-column: 1 / -1; grid-row: 1;
        box-sizing: border-box; height: var(--altura-hud);
        display: flex; align-items: center; gap: 24px; padding: 0 16px;
        background: #1e1a14; color: #ede3d0;
        font: 16px/1.4 system-ui, sans-serif;
      }
      #hud .campo { display: flex; gap: 6px; }
      #hud .rotulo { opacity: 0.7; }
      #hud .valor { font-weight: 700; }
      /* F11a: aviso de pausa/velocidade, na barra, a direita. Some (hidden) em 1x despausado. */
      #hud .aviso-tempo {
        margin-left: auto; padding: 2px 10px; border-radius: 4px;
        background: #c9974b; color: #1e1a14; font-weight: 700;
      }
      #hud .aviso-tempo[hidden] { display: none; }
      #jogo { grid-column: 1; grid-row: 2; min-width: 0; min-height: 0; overflow: hidden; }
      /* F-D1: o lembrete da primeira partida. Na BARRA, nao sobre o mapa — o
         canvas tem medidas afirmadas por roteiro (F06, F22) e um aviso novo por
         cima delas seria regressao de layout em troca de nada. */
      #hud .dica-ajuda {
        padding: 2px 10px; border: 1px solid #c9974b; border-radius: 4px;
        color: #c9974b; font-size: 13px;
      }
      #hud .dica-ajuda[hidden] { display: none; }
      /* F-D1: a tela de ajuda. Sobreposicao na celula do canvas, centrada, e
         `hidden` por padrao: fechada, ela nao existe para medida nenhuma. */
      #ajuda {
        grid-column: 1; grid-row: 2; place-self: center;
        box-sizing: border-box; max-width: 460px; max-height: calc(100% - 48px);
        overflow-y: auto; padding: 14px 18px;
        border: 2px solid #c9974b; border-radius: 6px;
        background: #1e1a14; color: #ede3d0;
        font: 14px/1.4 system-ui, sans-serif;
        box-shadow: 0 8px 32px #000a;
      }
      #ajuda[hidden] { display: none; }
      #ajuda h2 { margin: 0 0 8px; font-size: 18px; }
      #ajuda h3 { margin: 10px 0 4px; font-size: 12px; font-weight: 700; opacity: 0.7; }
      #ajuda .atalho { display: flex; align-items: baseline; gap: 10px; padding: 2px 0; }
      #ajuda .atalho .tecla {
        flex: 0 0 auto; min-width: 84px;
        padding: 2px 6px; border: 1px solid #3a3226; border-radius: 3px;
        background: #2a241b; color: #f2c14e;
        font: inherit; font-size: 12px; font-weight: 700; text-align: center;
      }
      #ajuda .rodape { margin: 12px 0 0; opacity: 0.6; font-size: 12px; }
      #jogo canvas { display: block; }
      #menu-build {
        grid-column: 2; grid-row: 2; min-height: 0; overflow-y: auto;
        box-sizing: border-box; padding: 8px;
        background: #1e1a14; color: #ede3d0;
        font: 14px/1.3 system-ui, sans-serif;
        display: flex; flex-direction: column; gap: 6px;
      }
      #menu-build h2 { margin: 4px 4px 2px; font-size: 15px; font-weight: 700; }
      #menu-build .item {
        display: flex; flex-direction: column; gap: 2px; text-align: left;
        padding: 6px 8px; border: 2px solid #3a3226; border-radius: 4px;
        background: #2a241b; color: inherit; font: inherit; cursor: pointer;
      }
      #menu-build .item .nome { font-weight: 700; }
      #menu-build .item .custo { opacity: 0.75; }
      #menu-build .item .requer { color: #c9974b; }
      /* BUG-A, parte 3. O destaque anterior era borda creme sobre fundo #3a3226,
         a dois passos do #2a241b dos outros itens: o operador nao percebeu qual
         estava selecionado. Agora o item ativo muda FUNDO, TEXTO e BORDA de uma
         vez, e ganha a barra lateral — quem varre a lista com o olho acha a
         barra antes de comparar tom de marrom. O roteiro da F06 MEDE a distancia
         entre o ativo e um inativo; esta linha nao e a prova. */
      #menu-build .item[aria-pressed="true"] {
        border-color: #f2c14e; background: #6b5320; color: #fff8e6;
        box-shadow: inset 5px 0 0 #f2c14e;
      }
      #menu-build .item[aria-disabled="true"] {
        cursor: not-allowed; opacity: 0.45; filter: grayscale(1);
      }
      /* F22: os avisos. SOBREPOSICAO na celula do canvas, como o painel, mas
         ancorada no canto oposto (`start end` contra o `end start` dele): os
         dois aparecem juntos e nao podem se cobrir. O roteiro da F22 MEDE os
         dois retangulos, nao confia nesta linha. */
      #alertas {
        grid-column: 1; grid-row: 2; place-self: start end; margin: 12px;
        box-sizing: border-box; max-width: 248px; padding: 6px 8px;
        border: 2px solid #8c4a25; border-radius: 4px;
        background: #1e1a14; color: #ede3d0;
        font: 14px/1.3 system-ui, sans-serif;
        display: flex; flex-direction: column; gap: 3px;
      }
      #alertas[hidden] { display: none; }
      #alertas h2 { margin: 0 0 2px; font-size: 13px; font-weight: 700; opacity: 0.7; }
      #alertas .alerta { display: flex; align-items: baseline; gap: 8px; }
      #alertas .alerta[hidden] { display: none; }
      #alertas .alerta .rotulo { color: #c9974b; flex: 1; }
      #alertas .alerta .contagem { font-weight: 700; font-variant-numeric: tabular-nums; }
      /* F13b: SOBREPOSICAO na celula do canvas, nao coluna nova. Uma terceira
         coluna encolheria o canvas e reprovaria o roteiro da F06, que afirma
         canvas.right <= painel.left. A F16b so renomeou (#painel-escola ->
         #painel-predio): a posicao e a largura seguem as mesmas, de proposito. */
      #painel-predio {
        grid-column: 1; grid-row: 2; place-self: end start; margin: 12px;
        box-sizing: border-box; width: 248px; max-height: calc(100% - 24px);
        overflow-y: auto; padding: 8px;
        border: 2px solid #3a3226; border-radius: 4px;
        background: #1e1a14; color: #ede3d0;
        font: 14px/1.3 system-ui, sans-serif;
        display: flex; flex-direction: column; gap: 5px;
      }
      #painel-predio[hidden] { display: none; }
      #painel-predio h2 { margin: 0 0 2px; font-size: 15px; font-weight: 700; }
      #painel-predio .slot {
        display: flex; align-items: baseline; gap: 6px;
        padding: 4px 6px; border: 1px solid #3a3226; border-radius: 3px;
        background: #2a241b;
      }
      #painel-predio .slot[data-estado="vazio"] { opacity: 0.35; }
      #painel-predio .slot .nome { font-weight: 700; flex: 1; }
      #painel-predio .slot .motivo { color: #c9974b; font-size: 12px; text-align: right; }
      #painel-predio .slot .progresso { opacity: 0.75; font-size: 12px; font-variant-numeric: tabular-nums; }
      #painel-predio .tipos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
      #painel-predio button {
        border: 1px solid #3a3226; border-radius: 3px; background: #2a241b;
        color: inherit; font: inherit; font-size: 12px; padding: 3px 6px; cursor: pointer;
      }
      #painel-predio button[aria-disabled="true"] { cursor: not-allowed; opacity: 0.45; }
      #painel-predio .fila-cheia { color: #c9974b; font-size: 12px; }
      /* F16b: o painel deixou de ser so a fila da escola. Linha = rotulo a
         esquerda, valor a direita; gaveta = rotulo mais os itens do estoque. */
      #painel-predio h3 { margin: 4px 0 0; font-size: 12px; font-weight: 700; opacity: 0.7; }
      #painel-predio .linha { display: flex; align-items: baseline; gap: 6px; font-size: 13px; }
      #painel-predio .linha .rotulo { opacity: 0.7; flex: 1; }
      #painel-predio .linha .valor { font-variant-numeric: tabular-nums; }
      #painel-predio .linha[data-ocupante="vago"] .valor { color: #c9974b; }
      #painel-predio .gaveta {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px; font-size: 12px;
      }
      #painel-predio .gaveta .rotulo { opacity: 0.7; }
      #painel-predio .gaveta .item {
        padding: 1px 4px; border: 1px solid #3a3226; border-radius: 3px; background: #2a241b;
      }
      #painel-predio .gaveta .vazia { opacity: 0.35; }
      /* F17b: o medidor de material da obra. Herda `.gaveta`; so o material que
         ja chegou inteiro ganha destaque, para "falta pedra" saltar aos olhos. */
      #painel-predio .gaveta.material .item[data-cheio="true"] {
        border-color: #6f8c3a; color: #cfe08a;
      }
      #painel-predio .acoes { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
      #painel-predio .acoes .pausado { color: #c9974b; font-size: 12px; }
      /* o unico botao que destroi trabalho: cor propria, e sozinho no rodape */
      #painel-predio button.demolir {
        margin-top: 4px; align-self: flex-start;
        border-color: #8c4a25; color: #d64b3f;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="jogo"></div>
    <aside id="alertas" hidden></aside>
    <aside id="ajuda" hidden></aside>
    <aside id="painel-predio" hidden></aside>
    <aside id="menu-build"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
