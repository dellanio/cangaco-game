<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cangaço</title>
    <!-- A grade (a barra a esquerda, o canvas na celula dele) e a pele moram em
         src/ui/estilo.css: a interface e de ui/, e o index.html so pendura os
         nos que os modulos de ui/ preenchem. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/ui/estilo.css" />
  </head>
  <body>
    <!-- UI-barra-a: a barra lateral unica, de cima para baixo. A dica do H
         (ajuda.ts) entra logo depois da logo; o carimbo de pausa (aviso-tempo.ts)
         dentro do minimapa. So o #corpo-aba rola. -->
    <aside id="barra">
      <div id="logo" data-marca="logo"></div>
      <div id="minimapa"><i class="rosa" aria-hidden="true"></i></div>
      <!-- a faixa tem altura fixa e fica, vazia, quando o #alertas some (F22):
           aviso que aparece nao empurra a grade -->
      <div id="faixa-alertas"><aside id="alertas" hidden></aside></div>
      <nav id="abas"></nav>
      <div id="corpo-aba">
      <section id="menu-build"></section>
      <section id="painel-predio" hidden></section>
      <section id="painel-grupo"></section>
      <section id="estatisticas">
        <h2>Estado da vila</h2>
        <div id="hud"></div>
      </section>
      <section id="distribuicao"></section>
      <section id="opcoes"></section>
      </div>
      <div id="marca" data-marca="lema"></div>
    </aside>
    <div id="jogo"></div>
    <!-- I-TELA-BARRA-RAPIDA-DE-RECURSOS: a barra fina no alto do meio do canvas (ui/barra-rapida.ts) -->
    <div id="barra-rapida" aria-label="Recursos"></div>
    <!-- I-TELA-JORNAL: o icone do jornal (canto inferior esquerdo do jogo) e a folha aberta no meio -->
    <button id="jornal-icone" type="button" hidden></button>
    <div id="jornal" hidden></div>
    <aside id="aviso-de-ordem" role="status" hidden></aside>
    <aside id="ajuda" hidden></aside>
    <script type="module" src="/src/inicio.ts"></script>
  </body>
</html>
